{{define "content"}}
<div class="page-head">
  <h1>Clients</h1>
  <a class="btn" href="/clients/new">+ Add client</a>
</div>
<div class="card">
  <form method="get" action="/clients">
    <input class="search" type="search" name="q" placeholder="Search name, phone, case type, adversary…"
           value="{{.Data.Query}}"
           hx-get="/clients" hx-trigger="input changed delay:250ms, search"
           hx-target="#clients-table" hx-swap="innerHTML"
           hx-push-url="false" autofocus>
  </form>
  <div id="clients-table">
    {{template "clients_table.html" .Data}}
  </div>
</div>
{{end}}
